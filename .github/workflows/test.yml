name: Test changes

on:
    workflow_dispatch:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v5
            with:
                fetch-depth: 0

          - name: Setup python
            uses: actions/setup-python@v6
            with:
                python-version: '3.12'

          - name: Install python dependencies
            run: |
                python -m pip install redis==7.0.0 psycopg2-binary==2.9.11 boto3==1.40.59

          - name: Run services
            run: |
                docker compose up -d && sleep 15

          - name: Perform checks
            run: |
                python ./.github/scripts/test.py
                
          - name: Shutdown services
            run: |
                docker compose down
 