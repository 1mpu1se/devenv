name: Test

on:
    workflow_dispatch:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v5
            with:
                fetch-depth: 0

          - name: Setup python
            uses: actions/setup-python@v6
            with:
                python-version: '3.12'

          - name: Install python dependencies
            run: |
                python -m pip install redis==7.0.0 psycopg2-binary==2.9.11 boto3==1.40.59 elasticsearch==9.2.0

          - name: Configure sysctl limits
            run: |
                sudo swapoff -a
                sudo sysctl -w vm.swappiness=1
                sudo sysctl -w fs.file-max=262144
                sudo sysctl -w vm.max_map_count=262144

          - name: Run services
            run: |
                docker compose up -d && sleep 60

          - name: Explore process status
            run: |
                docker compose ps

          - name: Explore logs
            run: |
                docker compose logs -t -n 20

          - name: Curl to elasticsearch
            run: |
                curl --user elastic:elastic http://127.0.0.1:9200

          - name: Perform checks
            run: |
                python ./.github/scripts/test.py
                
          - name: Shutdown services
            run: |
                docker compose down
 
