name: Test

on:
    workflow_dispatch:
    pull_request:
        branches: [main]

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v5
            with:
                fetch-depth: 0

          - name: Setup python
            uses: actions/setup-python@v6
            with:
                python-version: '3.12'

          - name: Install python dependencies
            run: |
                python -m pip install redis==7.0.0 psycopg2-binary==2.9.11 boto3==1.40.59 elasticsearch==9.2.0

          - name: Chown directory for elasticsearch
            run: |
                sudo chown -R 1000:1000 ./data/elasticsearch/

          - name: Run services
            run: |
                docker compose up -d

          - name: Wait for startup
            run: |
                sleep 30

          - name: Explore ps
            run: |
                docker compose ps

          - name: Explore logs
            run: |
                docker compose logs

          - name: Perform checks
            run: |
                python ./.github/scripts/test.py
                
          - name: Shutdown services
            run: |
                docker compose down
 
